version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: sst_control_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sst_control
      POSTGRES_USER: sst_user
      POSTGRES_PASSWORD: CAMBIA_ESTA_CLAVE
    ports:
      - "5432:5432"
    volumes:
      - sst_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: SstControl.Api/Dockerfile
    container_name: sst_control_api
    depends_on:
      - postgres
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=sst_control;Username=sst_user;Password=CAMBIA_ESTA_CLAVE"
    ports:
      - "5080:8080"

volumes:
  sst_pgdata:
