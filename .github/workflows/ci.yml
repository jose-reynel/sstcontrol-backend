name: CI backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore SstControl.sln

      - name: Compilar (Release)
        run: dotnet build SstControl.sln -c Release --no-restore

      - name: Ejecutar pruebas
        # No falla el pipeline si todavía no hay proyectos de prueba en la
        # solución — en cuanto se agregue uno (*.Tests.csproj), "dotnet test"
        # lo detecta automáticamente sin tocar este workflow.
        run: dotnet test SstControl.sln -c Release --no-build --verbosity normal || echo "Sin proyectos de prueba todavía."

  imagen-docker:
    runs-on: ubuntu-latest
    needs: compilar
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que la imagen Docker construye
        run: docker build -f SstControl.Api/Dockerfile -t sstcontrol-api:ci .
